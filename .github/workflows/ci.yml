name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vp check` runs format, lint and type checks in one pass.
      - run: pnpm exec vp check

      - run: pnpm exec vp test run

      - run: pnpm exec vp build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: |
          pnpm exec vp build
          pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK to a stable filename
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/taraz.apk

      - uses: actions/upload-artifact@v7
        with:
          name: taraz-debug-apk
          path: release/taraz.apk
          retention-days: 14

      # A rolling pre-release so the Pages download link always resolves.
      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          files: release/taraz.apk
          body: |
            Latest build from `main` — commit ${{ github.sha }}.

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/taraz.apk
          generate_release_notes: true

  pages:
    name: Landing page
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp site/index.html _site/
          cp public/favicon.svg _site/
          cp public/fonts/*.woff2 _site/fonts/
          info="$(date -u '+%Y-%m-%d') · ${GITHUB_SHA::7}"
          sed -i "s|__BUILD_INFO__|${info}|" _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
