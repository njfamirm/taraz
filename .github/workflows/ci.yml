name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vp check` runs format, lint and type checks in one pass.
      - run: pnpm exec vp check

      - run: pnpm exec vp test run

      - run: pnpm exec vp build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Release APK
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: |
          pnpm exec vp build
          pnpm exec cap sync android

      # A stable keystore is what makes updates installable over the previous
      # build; the debug key CI used to generate changed on every run.
      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set — see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taraz-release.p12"

      # versionCode must increase monotonically or Android refuses the update.
      - name: Resolve the version
        id: version
        run: |
          code="${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="0.0.0-nightly.${code}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: android
        env:
          TARAZ_VERSION_CODE: ${{ steps.version.outputs.code }}
          TARAZ_VERSION_NAME: ${{ steps.version.outputs.name }}
          TARAZ_KEYSTORE_PATH: ${{ runner.temp }}/taraz-release.p12
          TARAZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TARAZ_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          TARAZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the release payload
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/taraz.apk
          tag="nightly"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && tag="${GITHUB_REF#refs/tags/}"
          # The in-app updater reads this manifest; see src/native/updater.ts.
          cat > release/update.json <<JSON
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/taraz.apk",
            "releasedAt": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON
          ls -lh release

      - uses: actions/upload-artifact@v7
        with:
          name: taraz-release-apk
          path: release/
          retention-days: 14

      # A rolling pre-release so the Pages download link always resolves.
      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          files: |
            release/taraz.apk
            release/update.json
          body: |
            Latest build from `main` — commit ${{ github.sha }}.
            Version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}).

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/taraz.apk
            release/update.json
          generate_release_notes: true

  pages:
    name: Landing page
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp site/index.html _site/
          cp public/favicon.svg _site/
          cp public/fonts/*.woff2 _site/fonts/
          info="$(date -u '+%Y-%m-%d') · ${GITHUB_SHA::7}"
          sed -i "s|__BUILD_INFO__|${info}|" _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
